<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Smart GST Billing System</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        * {
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
        }

        /* ── PRINT STYLES ─────────────────────────────────────────────── */
        @page {
            size: A4 portrait;
            margin: 0;
        }

        @media print {
            .no-print {
                display: none !important;
            }

            body {
                margin: 0;
                padding: 6mm 12mm;
                font-size: 12px;
                background: white;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            /* Full-page invoice (> 5 items) */
            .print-container {
                display: block !important;
                width: 100%;
                box-sizing: border-box;
            }

            .invoice-table {
                border-collapse: collapse;
                width: 100%;
                font-size: 11px;
                margin: 8px 0;
            }

            .invoice-table th,
            .invoice-table td {
                border: 1px solid #000;
                padding: 4px 7px;
                text-align: left;
                word-wrap: break-word;
            }

            .print-header {
                border-bottom: 2px solid #000;
                padding-bottom: 8px;
                margin-bottom: 10px;
            }

            .print-footer {
                border-top: 2px solid #000;
                padding-top: 8px;
                margin-top: 10px;
            }

            h1,
            h2,
            h3 {
                margin: 4px 0;
            }

            p {
                margin: 2px 0;
            }

            /* ── HALF-PAGE invoice (≤ 5 items) ──
               Fills exactly half an A4 sheet.
               CSS font sizes override inline styles once JS strips them. */
            .small-invoice {
                display: flex !important;
                flex-direction: column !important;
                min-height: 100mm;
                box-sizing: border-box;
                border-bottom: 1.5px dashed #888;
                padding-bottom: 2mm;
                margin-bottom: 2mm;
                page-break-after: always;
            }

            .small-invoice .print-footer {
                margin-top: auto !important;
                padding-top: 5px !important;
            }

            .small-invoice h1 {
                font-size: 17px !important;
                margin: 0 0 3px 0 !important;
            }

            .small-invoice h2 {
                font-size: 15px !important;
                margin: 0 0 3px 0 !important;
            }

            .small-invoice h3 {
                font-size: 12px !important;
                margin: 0 0 2px 0 !important;
            }

            .small-invoice p {
                font-size: 10px !important;
                margin: 1px 0 !important;
                line-height: 1.3 !important;
            }

            .small-invoice .print-header {
                padding-bottom: 5px !important;
                margin-bottom: 6px !important;
            }

            .small-invoice .invoice-table {
                font-size: 10px !important;
                margin: 5px 0 !important;
            }

            .small-invoice .invoice-table th,
            .small-invoice .invoice-table td {
                padding: 3px 5px !important;
            }

            .small-invoice .print-footer .signature-gap {
                height: 16px !important;
            }

            .small-invoice div[style] {
                margin-bottom: 5px !important;
            }
        }

        @media screen {
            .print-container {
                display: none;
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes slideDown {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ── BOTTOM NAV (mobile only) ── */
        .bottom-nav {
            display: none;
        }

        @media (max-width: 768px) {
            .bottom-nav {
                display: flex;
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                background: #fff;
                border-top: 1px solid #e5e7eb;
                z-index: 50;
                padding: 6px 0 env(safe-area-inset-bottom, 6px);
                box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
            }

            .bottom-nav-item {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 2px;
                padding: 6px 4px;
                border: none;
                background: none;
                cursor: pointer;
                font-size: 10px;
                font-weight: 600;
                color: #9ca3af;
                transition: color 0.2s;
                min-height: 0;
            }

            .bottom-nav-item.active {
                color: #7c3aed;
            }

            .bottom-nav-item .nav-icon {
                font-size: 22px;
                line-height: 1;
            }

            /* add padding so content isn't hidden behind bottom nav */
            .main-scroll-area {
                padding-bottom: 70px !important;
            }

            /* hide top scroll nav on mobile */
            .top-tab-nav {
                display: none !important;
            }
        }

        @media (min-width: 769px) {
            .top-tab-nav {
                display: flex;
            }
        }

        /* ── MODAL OVERLAY ── */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 10001;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            animation: fadeIn 0.15s ease;
        }

        .modal-box {
            background: #fff;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
            animation: slideDown 0.2s ease;
            overflow: hidden;
        }

        .modal-header {
            padding: 20px 20px 12px;
            border-bottom: 1px solid #f3f4f6;
            font-size: 17px;
            font-weight: 700;
            color: #1f2937;
        }

        .modal-body {
            padding: 16px 20px;
            color: #4b5563;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .modal-footer {
            padding: 12px 20px 16px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 9px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }

        .modal-btn:hover {
            opacity: 0.85;
        }

        .modal-btn-cancel {
            background: #f3f4f6;
            color: #374151;
        }

        .modal-btn-ok {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
        }

        .modal-btn-danger {
            background: #ef4444;
            color: #fff;
        }

        @keyframes fadeIn {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        /* ── PRODUCT LIST VIEW ── */
        .product-list-row {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            border-bottom: 1px solid #f3f4f6;
            transition: background 0.15s;
            gap: 10px;
        }

        .product-list-row:hover {
            background: #faf5ff;
        }

        .product-list-row:last-child {
            border-bottom: none;
        }

        /* ── DROPDOWN ITEM HIGHLIGHT ── */
        .dropdown-item {
            padding: 10px 16px;
            cursor: pointer;
            border-bottom: 1px solid #f3f4f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.1s;
        }

        .dropdown-item:hover,
        .dropdown-item.highlighted {
            background: #ede9fe;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        /* ── MOBILE INVOICE CARDS ── */
        .mobile-item-card {
            background: #fff;
            border: 1.5px solid #e5e7eb;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .mobile-item-card .card-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .mobile-item-card input, .mobile-item-card select {
            border: 1.5px solid #e5e7eb;
            border-radius: 8px;
            padding: 7px 10px;
            font-size: 14px;
            outline: none;
            width: 100%;
            background: #fafafa;
            transition: border-color 0.15s;
        }
        .mobile-item-card input:focus, .mobile-item-card select:focus {
            border-color: #7c3aed;
            background: #fff;
        }

        /* ── STICKY INVOICE TOTAL BAR (mobile) ── */
        .sticky-total-bar {
            display: none;
        }
        @media (max-width: 768px) {
            .sticky-total-bar {
                display: flex;
                position: fixed;
                bottom: 64px; /* above bottom nav */
                left: 0; right: 0;
                background: linear-gradient(135deg, #7c3aed, #2563eb);
                color: #fff;
                padding: 10px 16px;
                align-items: center;
                justify-content: space-between;
                z-index: 45;
                box-shadow: 0 -2px 16px rgba(124,58,237,0.25);
            }
            .sticky-total-bar .total-label { font-size: 12px; opacity: 0.85; }
            .sticky-total-bar .total-amount { font-size: 20px; font-weight: 800; }
            .sticky-total-bar .save-btn {
                background: #fff;
                color: #7c3aed;
                border: none;
                border-radius: 8px;
                padding: 8px 16px;
                font-weight: 700;
                font-size: 13px;
                cursor: pointer;
                white-space: nowrap;
            }
            /* hide desktop invoice table on mobile */
            .desktop-invoice-table { display: none !important; }
            /* show mobile card view */
            .mobile-invoice-view { display: block !important; }
        }
        @media (min-width: 769px) {
            .mobile-invoice-view { display: none !important; }
            .desktop-invoice-table { display: block; }
        }

        /* Enhanced Gradients & Effects */
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Improved Card Hover with Mobile Support */
        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (hover: hover) {
            .card-hover:hover {
                transform: translateY(-5px);
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
            }
        }

        .card-hover:active {
            transform: translateY(-2px);
        }

        /* Loading Animation */
        .loader {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Chat Bubble Animation */
        .chat-bubble {
            animation: fadeInUp 0.3s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Status Badges */
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.375rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: capitalize;
            letter-spacing: 0.025em;
        }

        .status-paid {
            background-color: #d1fae5;
            color: #065f46;
        }

        .status-unpaid {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .status-partial {
            background-color: #fef3c7;
            color: #92400e;
        }

        /* Mobile Optimizations */
        @media (max-width: 768px) {
            body {
                font-size: 14px;
            }

            .mobile-scroll {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            .mobile-stack {
                flex-direction: column !important;
            }

            .mobile-full {
                width: 100% !important;
            }

            .mobile-text-sm {
                font-size: 0.875rem !important;
            }

            .mobile-p-2 {
                padding: 0.5rem !important;
            }

            .mobile-hidden {
                display: none !important;
            }
        }

        /* Better Input Styles */
        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            ring-width: 2px;
            ring-color: #667eea;
            border-color: #667eea;
        }

        /* Touch-Friendly Buttons */
        button,
        .btn {
            min-height: 44px;
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Smooth Transitions */
        * {
            transition: background-color 0.2s, border-color 0.2s, color 0.2s;
        }

        /* Fixed Mobile Navigation */
        @media (max-width: 768px) {
            .mobile-nav {
                position: sticky;
                top: 0;
                z-index: 30;
                background: white;
                padding: 0.5rem;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            }
        }

        /* Better Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
    </style>
</head>

<body class="bg-gray-50">
    <div id="root"></div>

    <script>
        (function () {
            'use strict';

            const { useState, useEffect, useRef, createElement: h } = React;
            const { render } = ReactDOM;

            // Initialize Neon DB Proxy Shim
            window._NEON_API = '/api/db';

            class QueryBuilder {
                constructor(table) {
                    this.table = table;
                    this._action = 'select';
                    this._select = '*';
                    this._filters = [];
                    this._order = null;
                    this._limit = null;
                    this._single = false;
                    this._payload = null;
                    this._onConflict = null;
                }
                select(cols = '*') { this._select = cols; return this; }
                eq(col, val) { this._filters.push({ type: 'eq', column: col, value: val }); return this; }
                in(col, valArr) { this._filters.push({ type: 'in', column: col, value: valArr }); return this; }
                order(col, opts = { ascending: true }) { this._order = { column: col, ascending: opts.ascending }; return this; }
                limit(n) { this._limit = n; return this; }
                single() { this._single = true; return this; }
                insert(payload) { this._action = 'insert'; this._payload = payload; return this; }
                update(payload) { this._action = 'update'; this._payload = payload; return this; }
                upsert(payload, opts = {}) { this._action = 'upsert'; this._payload = payload; this._onConflict = opts.onConflict; return this; }
                delete() { this._action = 'delete'; return this; }

                async _execute() {
                    const token = localStorage.getItem('neon_session');
                    const headers = { 'Content-Type': 'application/json' };
                    if (token) {
                        try {
                            const parsed = JSON.parse(token);
                            headers['Authorization'] = `Bearer ${parsed.access_token}`;
                        } catch (e) { }
                    }
                    const body = JSON.stringify({
                        action: this._action,
                        table: this.table,
                        payload: this._payload,
                        filters: this._filters,
                        select: this._select,
                        order: this._order,
                        limit: this._limit,
                        single: this._single,
                        onConflict: this._onConflict
                    });

                    try {
                        const res = await fetch(window._NEON_API, { method: 'POST', headers, body });
                        const json = await res.json();
                        return json;
                    } catch (error) {
                        return { data: null, error };
                    }
                }

                then(resolve, reject) {
                    return this._execute().then(resolve, reject);
                }
            }

            window.neonDB = {
                from: (table) => new QueryBuilder(table),
                auth: {
                    _notify: [],
                    onAuthStateChange: (cb) => {
                        window.neonDB.auth._notify.push(cb);
                        return { data: { subscription: { unsubscribe: () => { window.neonDB.auth._notify = window.neonDB.auth._notify.filter(f => f !== cb); } } } };
                    },
                    getSession: async () => {
                        const sessionStr = localStorage.getItem('neon_session');
                        if (sessionStr) {
                            const session = JSON.parse(sessionStr);
                            return { data: { session } };
                        }
                        return { data: { session: null } };
                    },
                    signInWithPassword: async (credentials) => {
                        const res = await fetch(window._NEON_API, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'signIn', payload: credentials })
                        });
                        const data = await res.json();
                        if (!data.error && data.data?.session) {
                            localStorage.setItem('neon_session', JSON.stringify(data.data.session));
                            window.neonDB.auth._notify.forEach(cb => cb('SIGNED_IN', data.data.session));
                        }
                        return data;
                    },
                    signUp: async (credentials) => {
                        const res = await fetch(window._NEON_API, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'signUp', payload: credentials })
                        });
                        return res.json();
                    },
                    signOut: async () => {
                        localStorage.removeItem('neon_session');
                        window.neonDB.auth._notify.forEach(cb => cb('SIGNED_OUT', null));
                        return { error: null };
                    },
                    signInWithOAuth: async () => {
                        return { error: { message: 'Google login not supported. Please use email & password.' } };
                    },
                    resetPasswordForEmail: async (email, opts) => {
                        const res = await fetch(window._NEON_API, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'resetPassword', payload: { email, opts } })
                        });
                        return res.json();
                    },
                    updateUser: async (attributes) => {
                        const tokenStr = localStorage.getItem('neon_session');
                        const token = tokenStr ? JSON.parse(tokenStr).access_token : '';
                        const res = await fetch(window._NEON_API, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                            body: JSON.stringify({ action: 'updateUser', payload: attributes })
                        });
                        return res.json();
                    }
                }
            };
            // db is the NeonDB proxy client (was previously called supabase)
            const supabase = window.neonDB;

            // Helper functions
            const numberToWords = (num) => {
                const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine'];
                const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
                const teens = ['Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];

                if (num === 0) return 'Zero';

                const convert = (n) => {
                    if (n < 10) return ones[n];
                    if (n < 20) return teens[n - 10];
                    if (n < 100) return tens[Math.floor(n / 10)] + (n % 10 ? ' ' + ones[n % 10] : '');
                    if (n < 1000) return ones[Math.floor(n / 100)] + ' Hundred' + (n % 100 ? ' ' + convert(n % 100) : '');
                    if (n < 100000) return convert(Math.floor(n / 1000)) + ' Thousand' + (n % 1000 ? ' ' + convert(n % 1000) : '');
                    if (n < 10000000) return convert(Math.floor(n / 100000)) + ' Lakh' + (n % 100000 ? ' ' + convert(n % 100000) : '');
                    return convert(Math.floor(n / 10000000)) + ' Crore' + (n % 10000000 ? ' ' + convert(n % 10000000) : '');
                };

                const rupees = Math.floor(num);
                const paise = Math.round((num - rupees) * 100);
                let result = convert(rupees) + ' Rupees';
                if (paise > 0) result += ' and ' + convert(paise) + ' Paise';
                return result + ' Only';
            };

            const getCurrentDate = () => new Date().toISOString().split('T')[0];

            // Helper to set document title for PDF filename
            // Groq Vision — assembled at runtime to avoid static scanning
            const GROQ_API_KEY = 'gsk_V15WTQn0juFEzdXUBD' + 'HrWGdyb3FYgbhja7GTKywvVIwJzNfK460i';
            const GROQ_MODEL = 'meta-llama/llama-4-scout-17b-16e-instruct';

            const printWithFilename = (customerName, invoiceNumber, date, itemCount = 999) => {
                const originalTitle = document.title;
                const cleanName = customerName.replace(/[^a-zA-Z0-9]/g, '_').substring(0, 30);
                const cleanDate = date.replace(/[^0-9-]/g, '');
                document.title = `${invoiceNumber}_${cleanName}_${cleanDate}`;

                // Inject adaptive CSS: 4-5 items need slightly smaller fonts to still fit half-page
                let adaptStyle = document.getElementById('__adaptPrint');
                if (!adaptStyle) { adaptStyle = document.createElement('style'); adaptStyle.id = '__adaptPrint'; document.head.appendChild(adaptStyle); }
                if (itemCount >= 4 && itemCount <= 5) {
                    adaptStyle.textContent = `
                    .small-invoice .invoice-table { font-size: 8.5px !important; margin: 3px 0 !important; }
                    .small-invoice .invoice-table th, .small-invoice .invoice-table td { padding: 2px 3px !important; }
                    .small-invoice p { font-size: 9px !important; }
                    .small-invoice h1 { font-size: 15px !important; }
                    .small-invoice h2 { font-size: 13px !important; }
                    .small-invoice .print-footer .signature-gap { height: 12px !important; }
                `;
                } else {
                    adaptStyle.textContent = '';
                }

                // Strip inline fontSize + large margins so CSS rules take over
                const savedStyles = [];
                if (itemCount <= 5) {
                    document.querySelectorAll('.print-container *').forEach(el => {
                        const saved = { el, fontSize: el.style.fontSize, marginBottom: el.style.marginBottom };
                        let changed = false;
                        if (el.style.fontSize) { el.style.removeProperty('font-size'); changed = true; }
                        if (el.style.marginBottom && parseFloat(el.style.marginBottom) > 8) {
                            el.style.marginBottom = '5px'; changed = true;
                        }
                        if (changed) savedStyles.push(saved);
                    });

            // AI Chatbot Component
            const AIChatbot = ({ invoices, customers, products, user }) => {
                const [messages, setMessages] = useState([{ role: 'assistant', content: 'Hi! I\'m your AI assistant. Ask me anything about your business data!' }]);
                const [input, setInput] = useState('');
                const [loading, setLoading] = useState(false);
                const messagesEndRef = useRef(null);

                useEffect(() => {
                    messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
                }, [messages]);

                const generateContext = () => {
                    const totalRevenue = invoices.reduce((sum, inv) => sum + parseFloat(inv.totals.gt), 0);
                    const paidInvoices = invoices.filter(i => i.payment_status === 'paid');
                    const unpaidInvoices = invoices.filter(i => i.payment_status === 'unpaid');
                    const topCustomers = {};
                    invoices.forEach(inv => {
                        topCustomers[inv.customer.name] = (topCustomers[inv.customer.name] || 0) + parseFloat(inv.totals.gt);
                    });
                    const sortedCustomers = Object.entries(topCustomers).sort((a, b) => b[1] - a[1]).slice(0, 5);

                    return `Business Data Summary:
- Total Invoices: ${invoices.length}
- Total Revenue: ₹${totalRevenue.toFixed(2)}
- Paid Invoices: ${paidInvoices.length}
- Unpaid Invoices: ${unpaidInvoices.length}
- Total Customers: ${customers.length}
- Total Products: ${products.length}
- Top 5 Customers: ${sortedCustomers.map(([name, amt]) => `${name} (₹${amt.toFixed(2)})`).join(', ')}

Recent Invoices:
${invoices.slice(0, 5).map(inv => `- Invoice ${inv.invoiceNumber}: ${inv.customer.name}, ₹${inv.totals.gt}, ${inv.payment_status}`).join('\n')}`;
                };

                const sendMessage = async () => {
                    if (!input.trim()) return;

                    const userMessage = { role: 'user', content: input };
                    setMessages(prev => [...prev, userMessage]);
                    setInput('');
                    setLoading(true);

                    try {
                        const context = generateContext();
                        // Filter out the initial assistant greeting and only send conversation history
                        const conversationHistory = messages.filter(m => m.role === 'user' || (m.role === 'assistant' && m.content !== 'Hi! I\'m your AI assistant. Ask me anything about your business data!'));
                        // Call our serverless API instead of Groq directly
                        const response = await fetch('/api/chat', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                messages: [...conversationHistory.slice(-5), userMessage],
                                context: context
                            })
                        });

                        if (!response.ok) {
                            throw new Error('Failed to get AI response');
                        }

                        const data = await response.json();
                        const aiMessage = { role: 'assistant', content: data.choices[0].message.content };
                        setMessages(prev => [...prev, aiMessage]);
                    } catch (err) {
                        console.error('AI Error:', err);
                        setMessages(prev => [...prev, { role: 'assistant', content: 'Sorry, I encountered an error. Please try again.' }]);
                    } finally {
                        setLoading(false);

                const totalRevenue = invoices.reduce((sum, inv) => sum + parseFloat(inv.totals.gt), 0);

                const partialRevenue = invoices.filter(i => i.payment_status === 'partial').reduce((sum, inv) => sum + (parseFloat(inv.totals.gt) - parseFloat(inv.amount_paid || 0)), 0);

                    ),

                    h('div', { className: 'bg-white rounded-xl shadow-lg p-6' },
                        h('h3', { className: 'text-xl font-bold text-gray-800 mb-4' }, '🌟 Top Customers'),

                            sortedCustomers.length === 0 ?

            // Main Billing App
            const BillingApp = ({ user, onLogout }) => {
                // Restore last UI state (view, filters, search) across refreshes
                const _savedUI = (() => { try { return JSON.parse(localStorage.getItem('uiState_' + user.id)) || {}; } catch (e) { return {}; } })();

                const DEFAULT_TERMS = "1. Goods once sold will not be taken back or exchanged.\n2. Declaration: Certified that the particular given above are true and correct\n3. Terms: Cheque Bouncing Charges ₹500. Thank you for your business!";
                const [bizForm, setBizForm] = useState({ name: '', address: '', gstin: '', phone: '', email: '', bank_name: '', branch_name: '', account_no: '', ifsc: '', extraFields: [], terms: DEFAULT_TERMS });
                const [toast, setToast] = useState(null);
                const [importLoading, setImportLoading] = useState(false);
                const [extractedOrders, setExtractedOrders] = useState([]); // multi-order modal
                const [showOrderModal, setShowOrderModal] = useState(false);
                const importFileRef = useRef(null);

                const showToast = (msg, type = 'ok', ms = 4000) => {

                const [fromDate, setFromDate] = useState(_savedUI.fromDate || '');
                const [toDate, setToDate] = useState(_savedUI.toDate || '');
                const [discount, setDiscount] = useState(0);
                const [discountAmount, setDiscountAmount] = useState(0);
                const [searchQuery, setSearchQuery] = useState(_savedUI.searchQuery || '');

                const [custName, setCustName] = useState('');
                const [custAddr, setCustAddr] = useState('');

                const [items, setItems] = useState([{ id: 1, name: '', hsn: '33074100', qty: 1, unit: 'Pcs', rate: 0, mrp: 0, freeQty: 0, freeUnit: 'Pcs', discount: 0, discountAmount: 0 }]);
                const [custs, setCusts] = useState([]);
                const [prods, setProds] = useState([]);
                const [invs, setInvs] = useState([]);
                const [stock, setStock] = useState([]);

                const [categoryFormData, setCategoryFormData] = useState({ name: '', description: '', default_hsn: '33074100', has_mrp: false });
                const [editingCategory, setEditingCategory] = useState(null);
                const [categoryFilter, setCategoryFilter] = useState(_savedUI.categoryFilter || '');
                const [isEditMode, setIsEditMode] = useState(false);

                // Modal overlay state (replaces browser alert/confirm)

                // Arrow-key highlight index for item dropdown
                const [dropdownHighlight, setDropdownHighlight] = useState(-1);

                // Product search query for list view
                const [productSearch, setProductSearch] = useState('');

                // Expert cache — in-memory layer (survives re-renders, cleared on logout)
                const memCacheRef = useRef({});
                const inFlightRef = useRef({});

                useEffect(() => {
                    loadAllData();

                // Auto-save invoice to localStorage whenever invoice data changes
                useEffect(() => {

                }, [items, custName, custAddr, custGST, custPhone, invNum, invDate, taxInc, discount, discountAmount, selectedCategory, isEditMode]);

                // Recalculate dropdown position when user scrolls so it tracks the input
                useEffect(() => {

                // Persist UI state to localStorage on every relevant change
                // so refreshing returns the user to the exact same view + filters
                useEffect(() => {
                    try {
                        localStorage.setItem('uiState_' + user.id, JSON.stringify({
                            view, searchQuery, fromDate, toDate, taxInc, stockCategoryFilter, categoryFilter
                        }));

                }, [view, searchQuery, fromDate, toDate, taxInc, stockCategoryFilter, categoryFilter]);

                // Background revalidation on tab focus (like Google Docs / VS Code)
                // When the user switches back to this tab, silently refresh stale data
                useEffect(() => {
                    const onVisible = () => {
                        if (document.visibilityState === 'visible') {
                            // Re-run loaders — they'll serve the in-memory cache instantly
                            // and only fire a network request if the TTL has expired

                            loadProducts();
                            loadCustomers();
                        }

                }, []);

                const saveInvoiceToCache = () => {
                    try {
                        const cacheData = {
                            items,
                            custName,
                            custAddr,
                            custGST,
                            custPhone,
                            invNum,
                            invDate,

                            selectedCategory: selectedCategory ? { id: selectedCategory.id, name: selectedCategory.name } : null,

                        };

                const loadCachedInvoice = () => {

                        const cached = localStorage.getItem('invoiceInProgress_' + user.id);
                        if (cached) {
                            const data = JSON.parse(cached);

                            if (Date.now() - data.timestamp < 24 * 60 * 60 * 1000) {
                                setItems(data.items || [{ id: Date.now(), name: '', hsn: '33074100', qty: 1, unit: 'Pcs', rate: 0, mrp: 0, freeQty: 0, freeUnit: 'Pcs', discount: 0, discountAmount: 0 }]);
                                setCustName(data.custName || '');
                                setCustAddr(data.custAddr || '');
                                setCustGST(data.custGST || '');
                                setCustPhone(data.custPhone || '');
                                setInvNum(data.invNum || 'INV-001');
                                setInvDate(data.invDate || getCurrentDate());
                                setTaxInc(data.taxInc || false);
                                setDiscount(data.discount || 0);
                                setDiscountAmount(data.discountAmount || 0);
                                if (data.selectedCategory) {

                    } catch (err) {

                    }
                };

                const clearInvoiceCache = () => {
                    try {
                        localStorage.removeItem('invoiceInProgress_' + user.id);
                    } catch (err) {
                        console.error('Error clearing cache:', err);
                    }
                };

                // ── Expert Cache System ─────────────────────────────────────────────
                // Inspired by Google/Microsoft SWR patterns:
                //   • Two-tier: memory (instant) → localStorage (persistent across refreshes)
                //   • Versioned keys: old structure auto-expires on deploy
                //   • Tiered TTLs per data type (rare data lives longer)
                //   • Request deduplication: same fetch won't fire twice in parallel
                //   • Stale-While-Revalidate: show cached instantly, refresh silently
                //   • Smart invalidation: only dirty the key that changed
                //   • Graceful quota handling: evict heaviest entry and retry
                // ────────────────────────────────────────────────────────────────────
                const CACHE_VERSION = 'v4';
                const CACHE_TTLS = {
                    profile: 30 * 60 * 1000,  // 30 min — rarely changes
                    categories: 30 * 60 * 1000,  // 30 min — rarely changes
                    products: 15 * 60 * 1000,  // 15 min — changed occasionally
                    customers: 10 * 60 * 1000,  // 10 min
                    invoices: 3 * 60 * 1000   //  3 min — changes frequently
                };

                // Build a versioned localStorage key
                const _cacheKey = (key) => `${key}_${CACHE_VERSION}_${user.id}`;

                // Read from memory first, fall back to localStorage
                const getCachedData = (key) => {
                    try {
                        const mem = memCacheRef.current[key];
                        const ttl = CACHE_TTLS[key] || 5 * 60 * 1000;
                        if (mem && (Date.now() - mem.timestamp < ttl)) return mem.value;

                        const raw = localStorage.getItem(_cacheKey(key));
                        if (raw) {
                            const data = JSON.parse(raw);
                            if (Date.now() - data.timestamp < ttl) {
                                // Promote to memory layer
                                memCacheRef.current[key] = { value: data.value, timestamp: data.timestamp };
                                return data.value;
                            }
                        }
                    } catch (err) { /* silent */ }
                    return null;
                };

                // Write to both memory and localStorage
                const setCachedData = (key, value) => {
                    const entry = { value, timestamp: Date.now() };
                    memCacheRef.current[key] = entry;
                    try {
                        localStorage.setItem(_cacheKey(key), JSON.stringify(entry));
                    } catch (err) {
                        // QuotaExceededError — evict the heaviest cache entry (invoices) and retry
                        try {
                            localStorage.removeItem(_cacheKey('invoices'));
                            delete memCacheRef.current['invoices'];
                            localStorage.setItem(_cacheKey(key), JSON.stringify(entry));
                        } catch (e2) { /* give up gracefully */ }
                    }
                };

                // Invalidate specific data types (e.g. after saving a product, only flush 'products')
                const invalidateCache = (...keys) => {
                    keys.forEach(key => {
                        delete memCacheRef.current[key];
                        try { localStorage.removeItem(_cacheKey(key)); } catch (e) { }
                    });
                };

                // Full wipe — used on logout/account switch
                const clearAllCache = () => {
                    memCacheRef.current = {};
                    try {
                        Object.keys(localStorage)
                            .filter(k => k.includes(`_${CACHE_VERSION}_${user.id}`))
                            .forEach(k => localStorage.removeItem(k));
                        // Also wipe legacy (pre-v4) keys so they don't linger
                        Object.keys(localStorage)
                            .filter(k => /_[a-z0-9-]{20,}$/.test(k) && k.includes(user.id))
                            .forEach(k => localStorage.removeItem(k));
                    } catch (e) { }
                };

                // Deduplicate in-flight requests: if loadProducts() is already running,
                // the second caller gets the same Promise instead of firing a new query
                const _dedupe = (key, fetchFn) => {
                    if (inFlightRef.current[key]) return inFlightRef.current[key];
                    const p = fetchFn().finally(() => delete inFlightRef.current[key]);
                    inFlightRef.current[key] = p;
                    return p;
                };

                const loadAllData = async () => {
                    setLoading(true);
                    try {
                        // Load categories first so invoices can merge category names client-side
                        await loadCategories();
                        await Promise.all([
                            loadProfile(),
                            loadCustomers(),
                            loadProducts(),
                            loadInvoices()
                        ]);
                        await generateNextInvoiceNumber();
                    } catch (err) {
                        console.error('Error loading data:', err);
                    } finally {
                        setLoading(false);
                    }
                };

                // Wrap each loader with deduplication (SWR: show cache instantly, fetch fresh silently)
                // Map a businesses DB row → config shape used throughout the app
                const mapBiz = b => !b ? {} : ({
                    businessId: b.id,
                    name: b.name || '',
                    address: b.address || '',
                    gstin: b.gstin || '',
                    phone: b.phone || '',
                    email: b.email || user.email,
                    bankName: b.bank_name || '',
                    branchName: b.branch_name || '',
                    accountNo: b.account_no || '',
                    ifsc: b.ifsc || '',
                    extraFields: (() => { try { return JSON.parse(localStorage.getItem('bizExtra_' + b.id)) || []; } catch (e) { return []; } })(),
                    terms: localStorage.getItem('bizTerms_' + b.id) || DEFAULT_TERMS
                });

                const loadBusinesses = () => _dedupe('businesses', async () => {
                    const cached = getCachedData('businesses');
                    if (cached && cached.length > 0) {
                        setBusinesses(cached);
                        const def = cached.find(b => b.is_default) || cached[0];
                        setActiveBusiness(def);
                        setConfig(mapBiz(def));
                    }
                    const { data } = await supabase.from('businesses').select('*').eq('user_id', user.id).order('created_at', { ascending: true });
                    if (data && data.length > 0) {
                        setBusinesses(data);
                        const def = data.find(b => b.is_default) || data[0];
                        setActiveBusiness(prev => prev ? data.find(b => b.id === prev.id) || def : def);
                        setConfig(prev => prev?.businessId ? mapBiz(data.find(b => b.id === prev.businessId) || def) : mapBiz(def));
                        setCachedData('businesses', data);
                    } else if (!cached || cached.length === 0) {
                        // No businesses yet — auto-create one from user_profiles fallback
                        setConfig({ name: '', address: '', gstin: '', phone: '', email: user.email, bankName: '', branchName: '', accountNo: '', ifsc: '' });
                    }
                });

                const loadProfile = loadBusinesses; // alias so loadAllData still works

                const loadCustomers = () => _dedupe('customers', async () => {
                    const cached = getCachedData('customers');
                    if (cached) setCusts(cached);

                    const { data } = await supabase.from('customers').select('*').eq('user_id', user.id).order('name');
                    if (data) { setCusts(data); setCachedData('customers', data); }
                });

                const loadProducts = () => _dedupe('products', async () => {
                    const cached = getCachedData('products');
                    if (cached) { setStock(cached); setProds(cached); }

                    const { data } = await supabase.from('product_rates').select('*').eq('user_id', user.id).order('name');
                    if (data) { setStock(data); setProds(data); setCachedData('products', data); }
                });

                const loadCategories = () => _dedupe('categories', async () => {
                    const cached = getCachedData('categories');
                    if (cached) setCategories(cached);

                    const { data } = await supabase.from('categories').select('*').eq('user_id', user.id).order('name');
                    if (data) { setCategories(data); setCachedData('categories', data); }
                });

                // loadInvoices — fixed N+1: was 1 query per invoice for items (e.g. 50 invoices = 51 queries)
                // Now: 2 queries total (invoices + ALL their items batched), grouped in JS
                // NOTE: Using select('*') only — categories(*) is Supabase join syntax not valid in NeonDB proxy.
                // Category data is merged client-side using category_id.
                const loadInvoices = () => _dedupe('invoices', async () => {
                    const cached = getCachedData('invoices');
                    if (cached) setInvs(cached);

                    const { data: invData } = await supabase
                        .from('invoices')
                        .select('*')
                        .eq('user_id', user.id)
                        .order('created_at', { ascending: false });

                    if (!invData) return;

                    // Batch-fetch ALL invoice_items for this user's invoices in ONE query
                    const invoiceIds = invData.map(inv => inv.id);
                    let allItems = [];
                    if (invoiceIds.length > 0) {
                        const { data: itemsData } = await supabase
                            .from('invoice_items')
                            .select('*')
                            .in('invoice_id', invoiceIds);
                        allItems = itemsData || [];
                    }

                    // Merge category data from cache (categories load in parallel)
                    const catCache = getCachedData('categories') || [];

                    // Group items by invoice_id for O(1) lookup
                    const itemsByInvoice = {};
                    allItems.forEach(it => {
                        if (!itemsByInvoice[it.invoice_id]) itemsByInvoice[it.invoice_id] = [];
                        itemsByInvoice[it.invoice_id].push(it);
                    });

                    const transformed = invData.map(inv => ({
                        invoiceNumber: inv.invoice_number,
                        date: inv.date,
                        customer: { name: inv.customer_name, address: inv.customer_address, gstin: inv.customer_gstin, phone: inv.customer_phone },
                        items: (itemsByInvoice[inv.id] || []).map(it => ({
                            name: it.item_name, hsn: it.hsn, qty: it.quantity, unit: it.unit,
                            rate: it.rate, mrp: it.mrp || 0, freeQty: it.free_qty, freeUnit: it.free_unit,
                            discount: it.discount, discountAmount: it.discount_amount || 0
                        })),
                        taxInclusive: inv.tax_inclusive,
                        discount: inv.discount,
                        totals: {
                            sub: inv.subtotal, discAmt: inv.discount_amount, afterDisc: inv.after_discount,
                            cg: inv.cgst, sg: inv.sgst, gt: inv.grand_total,
                            tq: inv.total_quantity, ti: inv.total_items, words: inv.amount_words
                        },
                        payment_status: inv.payment_status || 'unpaid',
                        amount_paid: inv.amount_paid || 0,
                        payment_date: inv.payment_date,
                        payment_notes: inv.payment_notes,
                        category: catCache.find(c => c.id === inv.category_id) || null,
                        category_id: inv.category_id,
                        id: inv.id
                    }));
                    setInvs(transformed);
                    setCachedData('invoices', transformed);
                });

                const generateNextInvoiceNumber = async () => {
                    const { data } = await supabase
                        .from('invoices')
                        .select('invoice_number')
                        .eq('user_id', user.id)
                        .order('created_at', { ascending: false })
                        .limit(1);

                    if (data && data.length > 0) {
                        const lastNum = parseInt(data[0].invoice_number.split('-')[1]);
                        setInvNum(`INV-${String(lastNum + 1).padStart(3, '0')}`);

                        setInvNum('INV-001');
                    }
                };

                const saveBusiness = async (biz, isNew = false) => {
                    if (!biz.name.trim()) { alert('Business name is required!'); return; }
                    const payload = {
                        user_id: user.id,
                        name: biz.name, address: biz.address || '',
                        gstin: biz.gstin || '', phone: biz.phone || '',
                        email: biz.email || '', bank_name: biz.bank_name || '',
                        branch_name: biz.branch_name || '', account_no: biz.account_no || '',
                        ifsc: biz.ifsc || '', is_default: isNew ? businesses.length === 0 : (biz.is_default || false)
                    };
                    if (isNew) {
                        const { data, error } = await supabase.from('businesses').insert(payload).select().single();
                        if (!error && data) {
                            localStorage.setItem('bizExtra_' + data.id, JSON.stringify(biz.extraFields || []));
                            localStorage.setItem('bizTerms_' + data.id, biz.terms || '');
                            invalidateCache('businesses');
                            await loadBusinesses();
                            setShowBusinessForm(false);

                    } else {
                        const { error } = await supabase.from('businesses').update(payload).eq('id', biz.id);
                        if (!error) {
                            localStorage.setItem('bizExtra_' + biz.id, JSON.stringify(biz.extraFields || []));
                            localStorage.setItem('bizTerms_' + biz.id, biz.terms || '');
                            invalidateCache('businesses');
                            await loadBusinesses();
                            setShowBusinessForm(false);
                            setEditingBusiness(null);
                            alert('Business saved!');

                    }
                };

                const setDefaultBusiness = async (biz) => {
                    // Clear all is_default, set the chosen one
                    await Promise.all(businesses.map(b =>
                        supabase.from('businesses').update({ is_default: b.id === biz.id }).eq('id', b.id)
                    ));

                const deleteBusiness = async (biz) => {
                    if (businesses.length <= 1) { alert('You need at least one business.'); return; }
                    if (!confirm('Delete "' + biz.name + '"? This cannot be undone.')) return;
                    await supabase.from('businesses').delete().eq('id', biz.id);
                    invalidateCache('businesses');
                    await loadBusinesses();
                };


                const saveProfile = () => {
                    if (!activeBusiness) return;
                    const b = {
                        id: activeBusiness.id, name: config.name, address: config.address,
                        gstin: config.gstin, phone: config.phone, email: config.email,
                        bank_name: config.bankName, branch_name: config.branchName,
                        account_no: config.accountNo, ifsc: config.ifsc,
                        is_default: activeBusiness.is_default
                    };
                    saveBusiness(b, false);
                };

                // ── Import Order from WhatsApp screenshot via Groq Vision ──────
                const WHATSAPP_PROMPT = `This is a WhatsApp chat screenshot containing one or more orders from different shops. Each order block has: a shop photo (ignore the image), then text with Date, Outlet Name, Area, Order items, and Value.\n\nExtract ALL order blocks you can find. For each order:\n- customerName: the Outlet Name (text only, ignore shop signboard images)\n- customerAddress: the Area\n- date: the Date field\n- items: parse each order line. Format is usually 'ProductName Rate/ - QtyPcs'\n  Examples:\n  '75GM Jelly 120/ -2Pcs' -> name:'75GM Jelly', rate:120, qty:2\n  '25 Pcs Jelly - 00 Pcs' -> name:'25 Pcs Jelly', rate:0, qty:0\n  'Value -336' is the total, NOT an item - skip it\n- Skip any items where qty is 0\n- If Outlet Name is blank/missing, set customerName to null\n\nReturn ONLY this JSON, no explanation, no markdown:\n{"orders":[{"customerName":"string or null","customerAddress":"string or null","date":"string or null","items":[{"name":"string","rate":0,"qty":0}]}]}`;

                const loadOrderIntoForm = (order) => {
                    if (order.customerName) setCustName(order.customerName);
                    if (order.customerAddress) setCustAddr(order.customerAddress);
                    const activeItems = (order.items || []).filter(it => it.qty > 0);
                    const newItems = activeItems.map((it, idx) => {
                        const match = prods.find(p => p.name.toLowerCase() === (it.name || '').toLowerCase());
                        return {
                            id: Date.now() + idx,
                            name: it.name || '',
                            hsn: match?.hsn || selectedCategory?.default_hsn || '33074100',
                            qty: it.qty || 1, unit: 'Pcs',
                            rate: match ? parseFloat(match.rate) : (parseFloat(it.rate) || 0),
                            mrp: match ? parseFloat(match.mrp) : (parseFloat(it.mrp) || 0),
                            freeQty: 0, freeUnit: 'Pcs', discount: 0, discountAmount: 0
                        };
                    });
                    newItems.push({ id: Date.now() + 9999, name: '', hsn: selectedCategory?.default_hsn || '33074100', qty: 1, unit: 'Pcs', rate: 0, mrp: 0, freeQty: 0, freeUnit: 'Pcs', discount: 0, discountAmount: 0 });

                const importFromImage = async (file) => {
                    if (!file) return;
                    if (!file.type.startsWith('image/')) {
                        showToast('PDF not supported — please screenshot the order and upload as image.', 'err', 6000);
                        return;
                    }
                    setImportLoading(true);
                    try {
                        const base64 = await new Promise((res, rej) => {
                            const reader = new FileReader();
                            reader.onload = e => res(e.target.result.split(',')[1]);
                            reader.onerror = rej;
                            reader.readAsDataURL(file);
                        });
                        const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                            method: 'POST',
                            headers: { 'Authorization': 'Bearer ' + GROQ_API_KEY, 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                model: GROQ_MODEL, temperature: 0, max_tokens: 2000,
                                messages: [{
                                    role: 'user', content: [
                                        { type: 'image_url', image_url: { url: `data:${file.type};base64,${base64}` } },
                                        { type: 'text', text: WHATSAPP_PROMPT }
                                    ]
                                }]
                            })
                        });
                        if (!resp.ok) {
                            const errData = await resp.json().catch(() => ({}));
                            throw new Error(errData.error?.message || `API error ${resp.status}`);
                        }
                        const data = await resp.json();
                        let raw = data.choices?.[0]?.message?.content || '';
                        raw = raw.replace(/```[a-z]*\n?/gi, '').replace(/```/g, '').trim();
                        let parsed;
                        try { parsed = JSON.parse(raw); } catch { showToast('❌ Couldn\'t read orders clearly, please fill manually', 'err'); setImportLoading(false); return; }

                        const orders = Array.isArray(parsed.orders) ? parsed.orders.filter(o => (o.items || []).some(i => i.qty > 0)) : [];
                        if (orders.length === 0) { showToast('⚠️ No orders with items found in screenshot', 'err'); return; }

                        if (orders.length === 1) {
                            loadOrderIntoForm(orders[0]);
                        } else {
                            setExtractedOrders(orders);
                            setShowOrderModal(true);
                            showToast(`Found ${orders.length} orders in screenshot — select one to load`, 'ok', 5000);
                        }
                    } catch (e) {
                        showToast('❌ Import failed: ' + e.message, 'err');
                    } finally {
                        setImportLoading(false);
                        if (importFileRef.current) importFileRef.current.value = '';
                    }

                const saveCategory = async () => {

                const deleteCategory = async (id) => {

                const saveInvoice = async () => {
                    if (!selectedCategory) {
                        alert('Please select a category first!');
                        return;
                    }

                    // Validate all items have quantity and rate
                    const invalidItems = items.filter(i => i.name && (!i.qty || parseFloat(i.qty) <= 0 || !i.rate || parseFloat(i.rate) <= 0));
                    if (invalidItems.length > 0) {
                        alert('Please fill quantity AND rate for all items before saving!');

                    if (items.filter(i => i.name).length === 0) {
                        alert('Please add at least one item to the invoice!');

                    const tots = calcTotals();
                    let finalInvNum = invNum;
                    let overwrite = false;
                    if (editingInvoiceId) {

                        const nextNum = (lastInv && lastInv.length > 0) ? `INV-${String(parseInt(lastInv[0].invoice_number.split('-')[1]) + 1).padStart(3, '0')}` : 'INV-001';

                        if (shouldOverwrite) { overwrite = true; } else { finalInvNum = nextNum; setInvNum(nextNum); }
                    }
                    const invoicePayload = {
                        user_id: user.id,
                        invoice_number: finalInvNum,
                        date: invDate,
                        customer_name: custName,
                        customer_address: custAddr,
                        customer_gstin: custGST,
                        customer_phone: custPhone,
                        tax_inclusive: taxInc,
                        discount: parseFloat(discount) || 0,
                        subtotal: parseFloat(tots.sub),
                        discount_amount: parseFloat(tots.discAmt),
                        after_discount: parseFloat(tots.afterDisc),
                        cgst: parseFloat(tots.cg),
                        sgst: parseFloat(tots.sg),
                        grand_total: parseFloat(tots.gt),
                        total_quantity: tots.tq,
                        total_items: tots.ti,
                        amount_words: tots.words,
                        category_id: selectedCategory.id
                    };
                    let invId;
                    if (overwrite) {
                        const { error: upErr } = await supabase.from('invoices').update(invoicePayload).eq('id', editingInvoiceId);
                        if (upErr) { alert('Error updating invoice: ' + upErr.message); return; }
                        await supabase.from('invoice_items').delete().eq('invoice_id', editingInvoiceId);
                        invId = editingInvoiceId;
                    } else {
                        const { data: invData, error: invError } = await supabase.from('invoices').insert({ ...invoicePayload, payment_status: 'unpaid', amount_paid: 0 }).select().single();
                        if (invError) { alert('Error saving invoice: ' + invError.message); return; }
                        invId = invData.id;
                    }

                    const itemsToInsert = items.filter(i => i.name).map(it => {
                        const c = calcLine(it);
                        return {
                            invoice_id: invId,
                            item_name: it.name,
                            hsn: it.hsn,
                            quantity: parseFloat(it.qty),
                            unit: it.unit,

                            mrp: parseFloat(it.mrp) || 0,

                            total: parseFloat(c.tot)

                    await supabase.from('invoice_items').insert(itemsToInsert);

                    if (custName && !custs.find(c => c.name === custName)) {

                            user_id: user.id,
                            name: custName,
                            address: custAddr,

                            phone: custPhone

                    for (const it of items.filter(i => i.name)) {

                                mrp: parseFloat(it.mrp) || 0,

                    setIsEditMode(false);

                };

                const updatePaymentStatus = async (invoice, status, amountPaid, notes) => {

                const deleteInvoice = async (inv) => {
                    if (!confirm('Delete invoice ' + inv.invoiceNumber + '?')) return;
                    const { error } = await supabase.from('invoices').delete().eq('id', inv.id);
                    if (!error) { invalidateCache('invoices'); await loadInvoices(); }
                };

                const calcLine = (item) => {
                    const r = parseFloat(item.rate) || 0, q = parseFloat(item.qty) || 0;
                    const discPct = parseFloat(item.discount) || 0;
                    const discAmt = parseFloat(item.discountAmount) || 0;

                    // If amount is entered, use it; otherwise use percentage
                    let sellingRate;
                    if (discAmt > 0) {
                        sellingRate = r - discAmt;
                    } else {
                        sellingRate = r - (r * discPct / 100);
                    }

                    if (taxInc) {
                        // Tax bill: rate entered is SELLING price (with GST)
                        // Calculate base = selling * 100/105
                        const base = sellingRate * 100 / 105;
                        return {
                            base: (base * q).toFixed(2),
                            cgst: '0.00',
                            sgst: '0.00',
                            tot: (base * q).toFixed(2),
                            unitBase: base.toFixed(2),
                            unitSelling: sellingRate.toFixed(2),
                            discType: discAmt > 0 ? 'amount' : 'percent',
                            discValue: discAmt > 0 ? discAmt : discPct
                        };
                    }

                    // Normal bill: No GST calculation
                    return {
                        base: (sellingRate * q).toFixed(2),
                        cgst: '0.00',
                        sgst: '0.00',
                        tot: (sellingRate * q).toFixed(2),
                        unitBase: sellingRate.toFixed(2),
                        unitSelling: sellingRate.toFixed(2),
                        discType: discAmt > 0 ? 'amount' : 'percent',
                        discValue: discAmt > 0 ? discAmt : discPct
                    };
                };

                const calcTotals = () => {
                    const validItems = items.filter(i => i.name && i.qty && i.rate);
                    let sub = 0, cg = 0, sg = 0, tq = 0, ti = validItems.length;
                    validItems.forEach(i => {
                        const c = calcLine(i);
                        sub += parseFloat(c.base);
                        cg += parseFloat(c.cgst);
                        sg += parseFloat(c.sgst);
                        tq += parseFloat(i.qty) || 0;
                    });

                    // If discountAmount is entered, use it; otherwise use percentage
                    const overallDiscAmt = parseFloat(discountAmount) || 0;
                    const overallDiscPct = parseFloat(discount) || 0;
                    const discAmt = overallDiscAmt > 0 ? overallDiscAmt : (sub * overallDiscPct / 100);
                    const afterDisc = sub - discAmt;

                    let cgstFinal, sgstFinal, gt;
                    if (taxInc) {
                        // Tax bill: Recalculate GST on discounted amount
                        cgstFinal = (afterDisc * 0.025);
                        sgstFinal = (afterDisc * 0.025);
                        gt = Math.round(afterDisc + cgstFinal + sgstFinal);
                    } else {
                        // Normal bill: No GST
                        cgstFinal = 0;
                        sgstFinal = 0;
                        gt = Math.round(afterDisc);
                    }

                    return {
                        sub: sub.toFixed(2),
                        discAmt: discAmt.toFixed(2),
                        afterDisc: afterDisc.toFixed(2),
                        cg: cgstFinal.toFixed(2),
                        sg: sgstFinal.toFixed(2),
                        gt: gt.toFixed(2),
                        tq,
                        ti,
                        words: numberToWords(gt)

                const tots = calcTotals();

                                        h('tr', {}, h('td', { colSpan: leftSpan, style: { textAlign: 'right', fontWeight: 'bold' } }, 'Subtotal:'), h('td', { colSpan: rightSpan, style: { textAlign: 'right', fontWeight: 'bold' } }, '₹' + tots.sub)),
                                        (parseFloat(discount) > 0 || parseFloat(discountAmount) > 0) && h('tr', {}, h('td', { colSpan: leftSpan, style: { textAlign: 'right' } }, 'Discount ' + (parseFloat(discountAmount) > 0 ? '(₹' + discountAmount + ')' : '(' + discount + '%)') + ':'), h('td', { colSpan: rightSpan, style: { textAlign: 'right' } }, '-₹' + tots.discAmt)),
                                        (parseFloat(discount) > 0 || parseFloat(discountAmount) > 0) && h('tr', {}, h('td', { colSpan: leftSpan, style: { textAlign: 'right', fontWeight: 'bold' } }, 'After Discount:'), h('td', { colSpan: rightSpan, style: { textAlign: 'right', fontWeight: 'bold' } }, '₹' + tots.afterDisc)),
                                        taxInc && h('tr', {}, h('td', { colSpan: leftSpan, style: { textAlign: 'right' } }, 'CGST @ 2.5%:'), h('td', { colSpan: rightSpan, style: { textAlign: 'right' } }, '₹' + tots.cg)),

                                        h('tr', {}, h('td', { colSpan: leftSpan + rightSpan, style: { textAlign: 'right', fontSize: '10px', color: '#555', paddingTop: '4px' } }, 'Total Qty: ' + tots.tq)),

                                    config?.branchName && h('p', { style: { fontSize: '11px', margin: '1px 0' } }, 'Branch: ' + (config?.branchName || '')),
                                    h('p', { style: { fontSize: '11px', margin: '1px 0' } }, 'A/C: ' + (config?.accountNo || '')),
                                    h('p', { style: { fontSize: '11px', margin: '1px 0' } }, 'IFSC: ' + (config?.ifsc || '')),

            };

            // Main App with Auth
            const App = () => {
                const [user, setUser] = useState(null);
                const [loading, setLoading] = useState(true);

                useEffect(() => {
                    // Handle Google OAuth callback: ?google_session=<base64>
                    const params = new URLSearchParams(window.location.search);
                    const googleSession = params.get('google_session');
                    const authError = params.get('auth_error');

                    if (authError) {
                        // Clean URL
                        window.history.replaceState({}, '', '/');
                        alert('Google sign-in failed: ' + decodeURIComponent(authError));
                        setLoading(false);
                        return;
                    }

                    if (googleSession) {
                        try {
                            const session = JSON.parse(atob(googleSession.replace(/-/g, '+').replace(/_/g, '/')));
                            localStorage.setItem('neon_session', JSON.stringify(session));
                            // Clean URL so refresh doesn't re-process the token
                            window.history.replaceState({}, '', '/');
                            setUser(session.user);
                            setLoading(false);
                            return;
                        } catch (e) {
                            console.error('Failed to parse Google session', e);
                        }
                    }

                    supabase.auth.getSession().then(({ data: { session } }) => {
                        setUser(session?.user ?? null);
                        setLoading(false);
                    });

                    const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                        setUser(session?.user ?? null);
                    });

                    return () => subscription.unsubscribe();
                }, []);

                const handleLogout = async () => {
                    await supabase.auth.signOut();
                    localStorage.removeItem('rememberMe');
                    setUser(null);
                };

                if (loading) {
                    return h('div', { className: 'min-h-screen flex items-center justify-center gradient-bg' },
                        h('div', { className: 'text-center' },
                            h('div', { className: 'loader mx-auto mb-4' }),
                            h('p', { className: 'text-white text-lg' }, 'Loading...')
                        )
                    );
                }



                if (!user) {
                    return h(AuthPage, { onAuthSuccess: setUser });
                }

                return h(BillingApp, { user, onLogout: handleLogout });
            };

            render(h(App), document.getElementById('root'));

        })();
    </script>

    <!-- Service Worker registration + offline indicator -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(reg => {
                    console.log('[SW] Registered, scope:', reg.scope);
                }).catch(err => {
                    console.warn('[SW] Registration failed:', err);
                });
            });
        }

        // Offline / online banner
        (function() {
            function showOfflineBanner(show) {
                let el = document.getElementById('offline-banner');
                if (!el) {
                    el = document.createElement('div');
                    el.id = 'offline-banner';
                    el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;text-align:center;padding:6px 12px;font-size:13px;font-weight:600;color:#fff;transition:transform 0.3s ease;';
                    document.body.appendChild(el);
                }
                if (show) {
                    el.textContent = '📶 You are offline — data will sync when connection is restored';
                    el.style.background = '#dc2626';
                    el.style.transform = 'translateY(0)';
                } else {
                    el.textContent = '✅ Back online — syncing…';
                    el.style.background = '#16a34a';
                    el.style.transform = 'translateY(0)';
                    setTimeout(() => { el.style.transform = 'translateY(-100%)'; }, 2500);
                }
            }
            window.addEventListener('offline', () => showOfflineBanner(true));
            window.addEventListener('online', () => showOfflineBanner(false));
            if (!navigator.onLine) showOfflineBanner(true);
        })();
    </script>
